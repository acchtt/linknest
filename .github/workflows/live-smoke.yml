name: LinkNest live deployment smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend and Pages Functions unit tests
        run: npm test
      - name: Verify public Cloudflare Pages deployment
        env:
          LINKNEST_URL: https://linknest-3bg.pages.dev
        run: node scripts/live-smoke.mjs